site_name: quant-pairs-lab
site_description: Dynamic statistical arbitrage with Kalman-filtered hedge ratios.
site_author: Jeff Milam, MBA
site_url: https://jmiaie.github.io/quant-pairs-lab/
repo_url: https://github.com/jmiaie/quant-pairs-lab
repo_name: jmiaie/quant-pairs-lab

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Methodology: methodology.md
  - Results: results.md
  - API Reference: reference.md
  - Translations:
      - Español: i18n/README.es.md
      - 中文: i18n/README.zh.md
      - 日本語: i18n/README.ja.md
      - Français: i18n/README.fr.md

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            members_order: source

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
